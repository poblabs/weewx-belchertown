# Language configuration file for Swedish (sv)
# Svensk langfil för Belchertown 3.2.0 (poblabs/weewx-belchertown)
# Struktur enligt lang/de.conf. Översättningar delvis från New Belchertowns
# sv.conf (uajqq) med kompletteringar för BT3-specifika nycklar.
# Rev 2 (2026-11-22): Terminologigranskad mot SMHI:s kunskapsbank och
# astronomisk standardterminologi. Ändringar: Beaufort-skalan till SMHI:s
# landbenämningar, Dagslängd, Evapotranspiration, Vattenvirvel, Imma (BR),
# Definitivt, Temperatursumma (GTS).
# US/Canada-varningskoder har tagits bort (relevanta endast med Xweather/NWS
# som prognoskälla, som inte används och inte fungerar i Europa).
# Fri att använda/ändra (GPL v3).
# OBS! Kopiera denna fil, den skrivs över vid skin-upgrade.

