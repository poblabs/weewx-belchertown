[Units]
    [[StringFormats]]

        NONE              = "N/D"

    [[Labels]]

        cm_per_hour       = " cm/h"
        foot              = " piedi"
        knot              = " nodi"
        knot2             = " nodi"
        mile              = " miglia"
        day               = " giorno",    " giorni"
        hour              = " ora",   " ore"
        minute            = " minuto", " minuti"
        second            = " secondo", " secondi"
        meter             = " metro", " metri"
        inch_per_hour     = " in/h"
        mm_per_hour       = " mm/h"
        NONE              = ""

    [[Ordinates]]

        # Ordinal directions. The last one should be for no wind direction
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/D
        #Per queste ordinate è necessario ridurre le dimensioni del carattere nel tema Belchertown
        #directions = Nord Tramontana, NNE  Grecale, NE  Grecale, ENE Levante, Est Levante, ESE Scirocco, SE Scirocco, SSE Scirocco, Sud   Ostro, SSO Libeccio, SO Libeccio, OSO Ponente, Ovest Ponente, ONO Maestrale, NO Maestrale, NNO Maestrale, N/D

